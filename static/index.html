<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>车间设备故障问答助手</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f0f4f7;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #1f6feb;
    color: #fff;
    padding: 14px 20px;
    font-size: 17px;
    font-weight: 600;
    box-shadow: 0 2px 6px rgba(0,0,0,.12);
  }
  header small { font-weight: 400; font-size: 12px; opacity: .85; margin-left: 8px; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14px;
  }
  .bubble.user { align-self: flex-end; background: #1f6feb; color: #fff; border-bottom-right-radius: 3px; }
  .bubble.bot  { align-self: flex-start; background: #fff; color: #222; border: 1px solid #e3e8ee; border-bottom-left-radius: 3px; }
  .tip { align-self: center; color: #8a94a6; font-size: 12px; margin: 4px 0; }
  footer { padding: 12px 20px; background: #fff; border-top: 1px solid #e3e8ee; display: flex; gap: 10px; }
  #input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #d4dbe3;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
  }
  #input:focus { border-color: #1f6feb; }
  #send {
    padding: 10px 22px;
    background: #1f6feb;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
  }
  #send:hover { background: #1857c3; }
  #send:disabled { background: #9db4d9; cursor: not-allowed; }
</style>
</head>
<body>
<header>车间设备故障问答助手<small>输入设备故障现象，我来帮你排查</small></header>

<div id="chat">
  <div class="tip">可以这样问：主轴异响 · 液压压力上不去 · 电机过载 · 机床不启动 · 导轨卡滞 · 冷却液泄漏</div>
</div>

<footer>
  <input id="input" type="text" placeholder="描述一下故障，比如：主轴异响" autocomplete="off">
  <button id="send">发送</button>
</footer>

<script>
// 用一个会话 id 记住当前对话，支撑多轮追问
const session_id = localStorage.getItem("fa_session") || ("s" + Date.now() + Math.floor(Math.random()*1000));
localStorage.setItem("fa_session", session_id);

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");

function addMsg(text, who) {
  const div = document.createElement("div");
  div.className = "bubble " + who;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function ask() {
  const q = input.value.trim();
  if (!q) return;
  addMsg(q, "user");
  input.value = "";
  sendBtn.disabled = true;
  try {
    const res = await fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, session_id })
    });
    const data = await res.json();
    addMsg(data.answer, "bot");
  } catch (e) {
    addMsg("服务出错了，请确认 python app.py 正在运行。", "bot");
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener("click", ask);
input.addEventListener("keydown", (e) => { if (e.key === "Enter") ask(); });
</script>
</body>
</html>
