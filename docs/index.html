<script>
/* 车间设备故障问答助手 —— 浏览器端逻辑
 * 与 Python 版 fault_kb.py / qa.py 一一对应（多步追问状态机、否定词识别、快捷分诊）。
 * 不依赖 DOM，可在 Node 里直接 require 做对照测试。
 */
(function (g) {
  "use strict";

  var NEG = new Set(["没", "不", "无", "非", "别"]);

  /* ---------- fault_kb.py ---------- */
  function findCase(cases, text) {
    for (var i = 0; i < cases.length; i++) {
      var kws = cases[i].keywords || [];
      for (var j = 0; j < kws.length; j++) {
        if (text.indexOf(kws[j]) !== -1) return cases[i];
      }
    }
    return null;
  }

  // 长词优先，且关键词前紧挨否定字（没/不/无…）时不算命中
  function hit(text, keywords) {
    var sorted = keywords.slice().sort(function (a, b) { return b.length - a.length; });
    for (var i = 0; i < sorted.length; i++) {
      var kw = sorted[i], start = 0;
      for (;;) {
        var idx = text.indexOf(kw, start);
        if (idx === -1) break;
        var prev = idx > 0 ? text.charAt(idx - 1) : "";
        if (!NEG.has(prev)) return true;
        start = idx + kw.length;
      }
    }
    return false;
  }

  function triage(cs, text) {
    var items = cs.triage || [];
    for (var i = 0; i < items.length; i++) {
      if (hit(text, items[i].keywords)) return { advice: items[i].advice, goto: -1 };
    }
    return null;
  }

  /* ---------- qa.py ---------- */
  var FALLBACK_FIRST =
    "我还没听明白。你能说一下是哪种设备、出现了什么现象吗？\n" +
    "比如：主轴异响、液压压力上不去、电机过载、机床不启动、导轨卡滞、冷却液泄漏。";
  var GENERIC_TEMPLATE =
    "按上面给的步骤检查后，把结果告诉我（比如灯亮不亮、有没有声音、油位够不够），" +
    "我就能帮你定位到具体是哪里的问题。";
  var DONE_MESSAGE = "针对「{name}」的排查建议我已经给完了。你可以按上面的步骤检查，或换个故障继续问我。";
  var TRY_WORDS = ["试了", "试过", "还是", "没用", "不行", "没有用", "怎么办", "怎么处理"];

  function questionOf(cs, step) {
    var steps = cs.steps || [];
    if (step >= 0 && step < steps.length) return steps[step].question;
    return "";
  }

  function createAssistant(cases) {
    var sessions = new Map();

    function ask(question, sessionId) {
      var sid = sessionId || "default";

      // 1) 识别出新故障 -> 开主题，从第 0 步开始
      var cs = findCase(cases, question);
      if (cs) {
        sessions.set(sid, { case: cs, step: 0 });
        return cs.answer + "\n\n" + questionOf(cs, 0);
      }

      var sess = sessions.get(sid);
      if (!sess) return FALLBACK_FIRST;

      cs = sess.case;
      var steps = cs.steps || [];

      // 2) 没等问就直接说出具体现象 -> 快捷分诊
      var t = triage(cs, question);
      if (t) {
        sess.step = t.goto;
        return t.advice;
      }

      // 3) 命中当前这一步的回答 -> 给建议并推进
      if (sess.step >= 0 && sess.step < steps.length) {
        var branches = steps[sess.step].branches || [];
        for (var i = 0; i < branches.length; i++) {
          var b = branches[i];
          if (hit(question, b.keywords)) {
            var goto = (b.goto === undefined || b.goto === null) ? -1 : b.goto;
            sess.step = goto;
            var nxt = questionOf(cs, goto);
            return b.advice + (nxt ? "\n\n" + nxt : "");
          }
        }
      }

      // 4) 用户反馈"试了/还是不行"
      for (var j = 0; j < TRY_WORDS.length; j++) {
        if (question.indexOf(TRY_WORDS[j]) !== -1) return GENERIC_TEMPLATE;
      }

      // 5) 兜底：引用用户原话 + 当前排查进度
      if (sess.step === -1) return DONE_MESSAGE.replace("{name}", cs.name);
      var qNow = questionOf(cs, sess.step) || "直接描述一下故障现象";
      return (
        "你说的「" + question + "」我还没对上号。我现在想确认：" + qNow + "\n" +
        "直接回 有/没有 或 是/不是，或者补设备型号/具体现象；要是换了故障，直接说故障名就行。"
      );
    }

    function reset(sessionId) {
      sessions.delete(sessionId || "default");
    }

    function state(sessionId) {
      var s = sessions.get(sessionId || "default");
      return s ? { name: s.case.name, step: s.step } : null;
    }

    return { ask: ask, reset: reset, state: state, cases: cases };
  }

  var api = {
    findCase: findCase,
    hit: hit,
    triage: triage,
    questionOf: questionOf,
    createAssistant: createAssistant,
    messages: { FALLBACK_FIRST: FALLBACK_FIRST, GENERIC_TEMPLATE: GENERIC_TEMPLATE, DONE_MESSAGE: DONE_MESSAGE }
  };

  if (typeof module !== "undefined" && module.exports) module.exports = api;
  g.FaultCore = api;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* 车间设备故障问答助手 —— 页面交互 */
(function () {
  "use strict";

  var chat = document.getElementById("chat");
  var input = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  var chips = document.getElementById("chips");
  var status = document.getElementById("status");
  var resetBtn = document.getElementById("reset");

  var SESSION = "demo";
  var fa = FaultCore.createAssistant(window.__FAULT_CASES__);
  var tip = chat.firstElementChild ? chat.firstElementChild.cloneNode(true) : null;

  var SAMPLES = [
    "主轴异响",
    "液压压力上不去",
    "电机过载报警",
    "机床不启动",
    "导轨卡滞",
    "冷却液泄漏"
  ];

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function scroll() { chat.scrollTop = chat.scrollHeight; }

  function addMsg(text, who) {
    var div = el("div", "bubble " + who, text);
    chat.appendChild(div);
    scroll();
  }

  function refreshStatus() {
    var st = fa.state(SESSION);
    if (!st) { status.textContent = "未开始 · 说一个故障现象开始"; return; }
    status.textContent = st.step === -1
      ? "当前主题：" + st.name + " · 建议已给完"
      : "当前主题：" + st.name + " · 第 " + (st.step + 1) + " 步追问";
  }

  function ask(text) {
    var q = (text !== undefined ? text : input.value).trim();
    if (!q) return;
    addMsg(q, "user");
    input.value = "";
    var a = fa.ask(q, SESSION);
    addMsg(a, "bot");
    refreshStatus();
    input.focus();
  }

  SAMPLES.forEach(function (s) {
    var b = el("button", "chip", s);
    b.type = "button";
    b.addEventListener("click", function () { ask(s); });
    chips.appendChild(b);
  });

  resetBtn.addEventListener("click", function () {
    fa.reset(SESSION);
    chat.innerHTML = "";
    if (tip) chat.appendChild(tip.cloneNode(true));
    refreshStatus();
    input.focus();
  });

  sendBtn.addEventListener("click", function () { ask(); });
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") ask(); });

  refreshStatus();

  // 截图/演示用：地址带 #demo 时自动走一轮
  if (location.hash === "#demo") ask(SAMPLES[0]);
})();

</script>
